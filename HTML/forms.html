<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<main>
<body>
    <form>
        <label for="name">Nome:</label>
        <input id="name" type="text">
<br>
        <label for="senha">Senha:</label>
        <input id="senha" type="password">
<br>
        <label for="data">Data: </label>
        <input type="date" name="" id="data">
<br>
        <label for="hora">Horário</label>
        <input type="time" id="hora">
<br>
        <label for="estado" id="select_Estado">Estado:</label>
        <select name="Estado" id="select_Estado">
<option value="CE">Ceará</option>
<option value="SP">São Paulo</option>
        </select>
<br>
        <label for="">Texto em  área:</label>
        <textarea rows="" cols="" id=""></textarea>
<br>
<br>
<fieldset>
<legend>Informações pessoais</legend>
<label for="">Nome:</label>
<input type="text">
<br>
<label for="">CPF:</label>
<input type="text" maxlength="11">
<br>
<label for="">Número de telefone:</label>
<input type="number">
</fieldset>
<input type="submit" value="Enviar">
<input type="reset" value="Limpar">
<br>
<fieldset>
<legend>Dados do endereço:</legend>
<label for="">Rua:</label>
<input type="text">
<br>
<label for="">Bairro:</label>
<input type="text">
<br>
<label for="">Número do endereço:</label>
<input type="number">
</fieldset>
<input type="submit" value="Enviar">
<input type="reset" value="Limpar">
<form/>
<br>
</body>
</main>
</html>
